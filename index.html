<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PopQuiz, a timed game-show quiz app." />
    <title>PopQuiz — Test Your Knowledge</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="marquee" aria-labelledby="app-title">
      <div class="bulbs" aria-hidden="true"></div>
      <div class="inner">
        <header>
          <p class="eyebrow">Step right up</p>
          <h1 id="app-title">PopQuiz</h1>
          <p class="subtitle">Test your knowledge</p>
        </header>

        <section class="screen active" id="setup-screen" aria-labelledby="category-heading">
          <h2 id="category-heading">Choose your category</h2>
          <div class="category-grid" id="category-grid" role="group" aria-label="Quiz category">
            <button class="category-button selected" type="button" data-category="general">General Knowledge</button>
            <button class="category-button" type="button" data-category="science">Science</button>
            <button class="category-button" type="button" data-category="coding">Coding</button>
            <button class="category-button" type="button" data-category="history">History</button>
          </div>
          <label class="sr-only" for="player-name">Your name</label>
          <input id="player-name" class="name-field" type="text" maxlength="24" placeholder="Your name for the leaderboard" autocomplete="nickname" />
          <button class="primary-button" id="start-button" type="button">Start Quiz <span aria-hidden="true">→</span></button>
        </section>

        <section class="screen" id="quiz-screen" aria-live="polite">
          <div class="hud">
            <p id="question-counter">Question 1 of 5</p>
            <div class="timer-ring" id="timer-ring" style="--progress: 100%" aria-label="10 seconds remaining">
              <span id="timer-text">10</span>
            </div>
          </div>
          <p class="category-label" id="active-category"></p>
          <h2 class="question" id="question-text"></h2>
          <div class="options" id="options-box"></div>
          <div class="progress-track" aria-label="Quiz progress"><div class="progress-fill" id="progress-fill"></div></div>
        </section>

        <section class="screen results" id="results-screen" aria-labelledby="results-title">
          <p class="eyebrow">Final score</p>
          <h2 id="results-title" class="score" aria-live="polite">0 / 5</h2>
          <p id="result-message" class="result-message">Nice try — go again.</p>
          <div class="leaderboard" aria-labelledby="leaderboard-title">
            <h3 id="leaderboard-title">🏆 Top 5 leaderboard</h3>
            <ol id="leaderboard-list"></ol>
          </div>
          <button class="secondary-button" id="play-again-button" type="button">Play Again</button>
        </section>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
